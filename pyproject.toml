[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmo-vgg"
version = "0.1.0"
description = "VGG + attention encoder for cosmological simulation latent spaces (CAMELS)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicholas Kern", email = "nkern.astro@gmail.com" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["cosmo_vgg"]

[tool.pytest.ini_options]
testpaths = ["cosmo_vgg/tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["cosmo_vgg"]
omit = ["cosmo_vgg/tests/*"]
